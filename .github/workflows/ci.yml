name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck (tsc --noEmit) for packages, ESLint for the editor.
      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # Packages via tsup, editor via `next build` (also typechecks the app).
      - name: Build
        run: pnpm build
